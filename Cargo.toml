[package]
name = "flightrelay"
version = "0.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Flight Relay Protocol (FRP) — a message bus for golf simulators, launch monitors and games, over WebSocket"
repository = "https://github.com/flightrelay/sdk-rust"

[package.metadata.docs.rs]
all-features = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tungstenite = { version = "0.26", optional = true }
toml = { version = "1", default-features = false, features = ["std", "serde", "parse", "display"], optional = true }
ctrlc = { version = "3", features = ["termination"], optional = true }

[features]
controller = []
transport = ["dep:tungstenite"]
config = []
driver = ["config"]
server = ["driver", "transport"]
main = ["server", "dep:toml", "dep:ctrlc"]
mock = ["driver"]

[[example]]
name = "frp-mock"
required-features = ["main", "mock"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
